{% load skillforge_ui %}
{% if page_obj and page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
    {% if page_obj.has_previous %}<a class="btn btn-ghost" href="{% page_query page_obj.previous_page_number %}">Page précédente</a>{% endif %}
    <span aria-current="page">Page {{ page_obj.number }} sur {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a class="btn btn-ghost" href="{% page_query page_obj.next_page_number %}">Page suivante</a>{% endif %}
</nav>
{% endif %}
