{% for message in messages %}
<div class="alert alert-{{ message.level_tag|default:'info' }}" role="{% if message.level >= 40 %}alert{% else %}status{% endif %}">
    <strong>{% if message.level >= 40 %}Erreur{% elif message.level >= 30 %}Attention{% elif message.level >= 25 %}Succès{% else %}Information{% endif %} :</strong> {{ message }}
</div>
{% endfor %}
