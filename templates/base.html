{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="SkillForge, une plateforme d’apprentissage par compétences avec mentorat, progression personnalisée et évaluation assistée par intelligence artificielle.">
    <title>{% block title %}SkillForge{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="{% static 'js/main.js' %}" defer></script>
</head>
<body>
    <a class="skip-link" href="#contenu-principal">Aller au contenu principal</a>
    <header class="site-header">
        <nav class="container navbar" aria-label="Navigation principale">
            <a class="brand" href="{% url 'home' %}">SkillForge<span class="brand-dot" aria-hidden="true">.</span></a>
            <ul class="nav-links">
                <li><a href="{% url 'home' %}"{% if request.resolver_match.url_name == 'home' %} aria-current="page"{% endif %}>Accueil</a></li>
                <li><span class="nav-placeholder">Modules <span class="badge">À venir</span></span></li>
            </ul>
        </nav>
    </header>
    <main id="contenu-principal" class="container" tabindex="-1">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <div class="container footer-content">
            <span class="brand">SkillForge</span>
            <p>Apprendre et progresser ensemble.</p>
        </div>
    </footer>
</body>
</html>
